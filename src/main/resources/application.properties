# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
server.port=8080

# DataSource y JavaMail se configuran manualmente con @Configuration
# Se excluye la auto-configuracion para evitar conflicto con las claves db.* y smtp.*
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
spring.autoconfigure.exclude[2]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =============================================
# Configuracion de Base de Datos MySQL
# =============================================
db.host=localhost
db.port=3306
db.name=crud_usuarios
db.username=root
db.password=root


# =============================================
# Configuracion SMTP (JavaMail)
# =============================================
# Propiedades que tu clase SmtpSpringConfig esta buscando mediante @Value
smtp.host=smtp.office365.com
smtp.port=587
smtp.username=sergiolvargas95@hotmail.com
smtp.password=ivxueiegqxruibeu
smtp.from.address=sergiolvargas95@hotmail.com
smtp.from.name=Gestion de Usuarios

# Propiedades nativas requeridas por Spring Boot para JavaMailSender
spring.mail.host=smtp.office365.com
spring.mail.port=587
spring.mail.username=sergiolvargas95@hotmail.com
spring.mail.password=ivxueiegqxruibeu
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

